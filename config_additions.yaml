temperature_controller:
  backend: rs485_ascii           # modbus | rs485_ascii | none
  setpoint_limits_c: [20, 450]
  end_setpoint_c: 30
  temperature_steps_c: [50, 100, 150, 200]
  stable_source: dmm
  setpoint_tolerance_c: 2.0

  rs485_ascii:                   # FILL IN from controller manual / rs485_term.py
    port: COM5
    baudrate: 9600
    parity: N
    stopbits: 1
    bytesize: 8
    timeout_s: 0.5
    address: 1
    prefix: ""                   # e.g. "\x02" (STX) or "@"
    eol: "\\r"                   # sent terminator
    reply_eol: "\\r"             # reply terminator
    checksum: none               # none | sum8 | xor8 | lrc  (2 hex chars before eol)
    echo: false                  # true if adapter echoes TX bytes back
    turnaround_s: 0.02
    read_pv: "{addr:02d}RPV"     # {addr} = address
    read_sp: "{addr:02d}RSP"     # "" = no setpoint readback
    write_sp: "{addr:02d}WSP{value:06.1f}"   # {value} = C/scale, {raw} = int(round(value)); "" = read-only
    reply_regex: "([-+]?\\d+(?:\\.\\d+)?)\\s*$"   # group 1 = number (last number in reply)
    write_ack_regex: null        # e.g. "OK|ACK"
    error_regex: null            # e.g. "ERR|NAK|\\?"
    invalid_regex: ["oPEn", "----"]           # sensor fault -> NaN
    scale: 1.0                   # number x scale = C (use 0.1 if reply is 1234 for 123.4)

  modbus:
    mode: rtu                    # rtu | ascii
    port: COM5
    slave_address: 1
    baudrate: 9600
    parity: N
    stopbits: 1
    bytesize: 8
    timeout_s: 0.5
    pv_register: 4096
    pv_function: 3
    sp_register: 4097
    sp_read_function: 3
    write_function: 6
    scale: 0.1
    signed: true
    invalid_raw: [32767, -32768]
