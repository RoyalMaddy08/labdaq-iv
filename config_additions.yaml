temperature_controller:
  backend: rs485_ascii           # modbus | rs485_ascii | manual | none
  setpoint_limits_c: [20, 450]
  end_setpoint_c: 30
  temperature_steps_c: [50, 100, 150, 200]
  stable_source: dmm
  setpoint_tolerance_c: 2.0      # controller PV vs setpoint (modbus, rs485_ascii)
  arrival_tolerance_c: 10        # manual: sample T within this of step before 'stable' counts; null = off

  manual:
    auto_confirm: false          # true = no prompts (sim tests only)
    beep: true

  rs485_ascii:                   # FILL IN from controller manual / rs485_term.py
    port: COM5
    baudrate: 9600
    parity: N
    stopbits: 1
    bytesize: 8
    timeout_s: 0.5
    address: 1
    prefix: ""                   # e.g. "\x02" (STX) or "@"
    eol: "\\r"                   # sent terminator
    reply_eol: "\\r"             # reply terminator
    checksum: none               # none | sum8 | xor8 | lrc  (2 hex chars before eol)
    echo: false                  # true if adapter echoes TX bytes back
    turnaround_s: 0.02
    read_pv: "{addr:02d}RPV"     # {addr} = address
    read_sp: "{addr:02d}RSP"     # "" = no setpoint readback
    write_sp: "{addr:02d}WSP{value:06.1f}"   # {value} = C/scale, {raw} = int(round(value)); "" = read-only
    reply_regex: "([-+]?\\d+(?:\\.\\d+)?)\\s*$"   # group 1 = number (last number in reply)
    write_ack_regex: null        # e.g. "OK|ACK"
    error_regex: null            # e.g. "ERR|NAK|\\?"
    invalid_regex: ["oPEn", "----"]           # sensor fault -> NaN
    scale: 1.0                   # number x scale = C (use 0.1 if reply is 1234 for 123.4)

  modbus:
    mode: rtu                    # rtu | ascii
    port: COM5
    slave_address: 1
    baudrate: 9600
    parity: N
    stopbits: 1
    bytesize: 8
    timeout_s: 0.5
    pv_register: 4096
    pv_function: 3
    sp_register: 4097
    sp_read_function: 3
    write_function: 6
    scale: 0.1
    signed: true
    invalid_raw: [32767, -32768]

rt:                              # run_rt.py (R-T), uses temperature_controller.backend above
  bias_v: 1.0                    # constant bias (V); SMU must be in voltage mode, set compliance in smu block
  max_bias_v: 5.0                # refuse bigger bias
  alternate_polarity: false      # true: R = (V+ - V-)/(I+ - I-), cancels offsets/thermo-EMF
  settle_s: 0.3                  # per polarity, only with alternate_polarity
  interval_s: 1.0                # one point every interval_s
  log_every: 10
  abort_on_compliance: false     # false = flag the point and keep going
  max_consecutive_errors: 5
  done_source: dmm               # dmm | controller: which T decides a segment has arrived
  arrival_tolerance_c: 5         # heating done when T >= target - tol, cooling when T <= target + tol
  segment_timeout_s: 7200        # move to the next segment anyway (flagged in metadata)
  sp_update_s: 30                # ramp: setpoint written every N s (keep >= 10 s, many controllers save SP to EEPROM)
  max_duration_s: null           # backend none only: stop after N s (null = until Ctrl+C)
  profile:                       # ignored for backend none
    - {to_c: 400, rate_c_per_min: 5}      # heat; rate null = jump setpoint (always a jump for manual)
    - {hold_s: 300}
    - {to_c: 40, rate_c_per_min: null}    # cool (natural cooling)
